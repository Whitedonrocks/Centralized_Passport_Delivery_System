                </div>

                <div style="border:2px solid var(--purple);border-radius:var(--radius);padding:14px;background:rgba(107,33,168,0.04);margin-bottom:16px;text-align:center">
                  <div style="font-size:0.8125rem;color:var(--purple);font-weight:700;text-transform:uppercase">Total Released Amount</div>
                  <div style="font-size:1.8rem;font-weight:700;color:var(--purple);margin:4px 0" class="num">${rs(disb.amount)}</div>
                  <div style="font-size:0.8125rem;color:var(--ink-2)">${esc(disb.notes)}</div>
                </div>

                <div style="margin-top:24px;display:flex;justify-content:space-between;border-top:1px dashed #000;padding-top:14px;font-size:0.8125rem">
                  <div>Authorized By:<br><b>${esc(disb.approvedBy)}</b><br><small>DAO Kathmandu Executive Authority</small></div>
                  <div style="text-align:right">Recipient Acknowledgment:<br>___________________________<br><small>Nepal Post Accounts Section</small></div>
                </div>
              </div>
              <div class="modal-foot">
                <button class="btn sec" data-a="close-modal">Close</button>
                <button class="btn primary" onclick="window.print()">
                  ${ic('print', 16)} <span>Print Disbursement Advice</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }
      root.innerHTML = modalContent;
    }

    /* Accessibility Panel HTML */
    function panelHTML() {
      const FILT = [
        ['none', 'f.standard', ''],
        ['hc', 'f.hc', ''],
        ['mono', 'f.mono', ''],
        ['pro', 'f.pro', 'red-weak'],
        ['deu', 'f.deu', 'green-weak'],
        ['tri', 'f.tri', 'blue-weak']
      ];
      const FS = { none: '', hc: '', mono: 'grayscale(1)', pro: 'url(#f-pro)', deu: 'url(#f-deu)', tri: 'url(#f-tri)' };

      return `
        <div class="modal-scrim" data-a="a11y-close"></div>
        <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="a-t">
          <div class="dh">
            <h2 id="a-t">${t('a.title')}</h2>
            <button class="iconbtn" data-a="a11y-close" aria-label="${t('a.close')}">${ic('x', 20)}</button>
          </div>
          <div class="dsec">
            <h3>${t('a.lang')}</h3>
            <div class="seg" role="group">
              <button data-a="p-lang" data-v="en" aria-pressed="${S.lang === 'en'}">${S.lang === 'en' ? ic('check', 16) : ''}English</button>
              <button data-a="p-lang" data-v="ne" aria-pressed="${S.lang === 'ne'}">${S.lang === 'ne' ? ic('check', 16) : ''}नेपाली</button>
            </div>
          </div>
          <div class="dsec">
            <h3>${t('a.size')}</h3>
            <div class="sizer">
              <button class="btn sec" data-a="p-size" data-v="-1"${S.scale <= 87.5 ? ' disabled' : ''}>${ic('minus', 18)}A</button>
              <output aria-live="polite">${nd(S.scale)}%</output>
              <button class="btn sec" data-a="p-size" data-v="1"${S.scale >= 150 ? ' disabled' : ''}>${ic('plus', 18)}A</button>
            </div>
            <p style="margin:8px 0 0"><button class="txtbtn plain" data-a="p-size" data-v="0" style="padding:0;border:none;background:transparent;color:var(--link);height:auto">${t('a.reset')}</button></p>
          </div>
          <div class="dsec">
            <h3>${t('a.theme')}</h3>
            <div class="seg" role="group">
              <button data-a="p-theme" data-v="light" aria-pressed="${S.theme === 'light'}">${ic('sun', 16)} Light</button>
              <button data-a="p-theme" data-v="dark" aria-pressed="${S.theme === 'dark'}">${ic('moon', 16)} Dark</button>
            </div>
          </div>
          <div class="dsec">
            <h3>${t('a.filter')}</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
              ${FILT.map(f => `
                <button class="btn sec sm" data-a="p-filter" data-v="${f[0]}" style="${S.filter === f[0] ? 'border-color:var(--primary);background:var(--primary-tint)' : ''}">
                  ${t(f[1])}
                </button>
              `).join('')}
            </div>
          </div>
          <div class="dsec">
            <h3>${t('a.data')}</h3>
            <div class="trow">
              <div><b>${t('a.lowbw')}</b><small>${t('a.lowbw.p')}</small></div>
              <button class="tgl" role="switch" aria-checked="${S.lowbw}" data-a="p-tgl" data-k="lowbw">${S.lowbw ? t('a.on') : t('a.off')}</button>
            </div>
          </div>
          <div class="dsec">
            <h3>${t('a.motion')}</h3>
            <div class="trow">
              <div><b>${t('a.cursor')}</b><small>${t('a.cursor.p')}</small></div>
              <button class="tgl" role="switch" aria-checked="${S.cursor}" data-a="p-tgl" data-k="cursor">${S.cursor ? t('a.on') : t('a.off')}</button>
            </div>
            <div class="trow" style="margin-top:10px">
              <div><b>${t('a.pause')}</b><small>${t('a.pause.p')}</small></div>
              <button class="tgl" role="switch" aria-checked="${S.pause}" data-a="p-tgl" data-k="pause">${S.pause ? t('a.on') : t('a.off')}</button>
            </div>
          </div>
          <div class="dsec" style="border:0">
            <button class="btn sec block" data-a="p-resetAll">${ic('reset', 18)} <span>${t('a.resetAll')}</span></button>
          </div>
        </div>
      `;
    }

    function renderPanel() {
      const r = $('#a11y-root');
      r.innerHTML = S.panel ? panelHTML() : '';
    }

    /* Master Render */
    function render() {
      applyPrefs();

      // View lookup
      const VIEWS = {
        dashboard: vDashboard,
        verification: vVerification,
        dispatch: vDispatch,
        shipments: vShipments,
        escalations: vEscalations,
        audit: vAudit,
        super_admin: vSuperAdmin
      };

      const content = S.auth ? chrome((VIEWS[S.route] || vDashboard)()) : loginPage();
      $('#app').innerHTML = content;

      renderModals();
      renderPanel();

      const toastRoot = $('#toast-root');
      if (S.toast) {
        toastRoot.innerHTML = `<div class="toast">${ic('check', 18)} <span>${esc(S.toast)}</span></div>`;
      } else {
        toastRoot.innerHTML = '';
      }
    }

    /* ==========================================================================
       EVENT DISPATCHER
       ========================================================================== */
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-a]');
      if (!b) return;
      const a = b.dataset.a, v = b.dataset.v, id = b.dataset.id;

      switch (a) {
        case 'skip':
          e.preventDefault();
          const m = $('#main');
          if (m) { m.setAttribute('tabindex', '-1'); m.focus(); }
          break;

        case 'lang-toggle':
          pref('lang', S.lang === 'en' ? 'ne' : 'en');
          break;

        case 'theme-toggle':
          pref('theme', S.theme === 'dark' ? 'light' : 'dark');
          break;

        case 'a11y-open':
          e.preventDefault();
          S.panel = true;
          renderPanel();
          break;

        case 'a11y-close':
          S.panel = false;
          renderPanel();
          break;

        case 'p-lang':
          pref('lang', v);
          break;

        case 'p-theme':
          pref('theme', v);
          break;

        case 'p-filter':
          pref('filter', v);
          break;

        case 'p-size':
          if (v === '0') S.scale = 100;
          else if (v === '-1') S.scale = Math.max(87.5, S.scale - 12.5);
          else if (v === '1') S.scale = Math.min(150, S.scale + 12.5);
          pref('scale', S.scale);
          break;

        case 'p-tgl':
          pref(b.dataset.k, !S[b.dataset.k]);
          break;

        case 'p-resetAll':
          S.lang = 'en';
          S.theme = 'light';
          S.scale = 100;
          S.filter = 'none';
          S.lowbw = false;
          S.cursor = false;
          S.pause = false;
          S.mode = false;
          applyPrefs();
          render();
          break;

        /* Navigation */
        case 'nav':
          e.preventDefault();
          if (v === 'super_admin' && (!S.user || S.user.role !== 'super')) {
            showToast('Access Denied: Super Admin credentials required', true);
            return;
          }
          S.route = v;
          render();
          break;

        /* Auth Actions */
        case 'toggle-pw':
          S.login.showPw = !S.login.showPw;
          render();
          break;

        case 'refresh-captcha':
          S.login.captcha = generateCaptcha();
          render();
          break;

        case 'fill-admin':
          S.login.username = 'admin';
          S.login.password = 'admin';
          S.login.captchaInput = S.login.captcha;
          render();
          break;

        case 'fill-super':
          S.login.username = 'superadmin';
          S.login.password = 'admin123';
          S.login.captchaInput = S.login.captcha;
          render();
          break;

        case 'do-login':
        case 'submit-login':
          const un = (S.login.username || '').trim().toLowerCase();
          const pw = (S.login.password || '').trim();
          const ci = (S.login.captchaInput || '').trim().toUpperCase();

          if (ci !== S.login.captcha) {
            S.login.err = t('err.captcha');
            S.login.captcha = generateCaptcha();
            render();
            return;
          }

          if (un === 'admin' && pw === 'admin') {
            S.auth = true;
            S.user = { id: 'DAO-KTM-8412', name: 'Santosh Neupane', role: 'admin', title: 'Dispatch & Operations Officer', counter: 'Counter 3 - Dispatch Desk' };
            S.login.err = '';
            S.route = 'dashboard';
            addAuditLog('Staff Login', 'DAO Operations Admin Session Authenticated');
            saveState();
            showToast('Welcome, Santosh Neupane (Operations Officer)');
          } else if (un === 'superadmin' && pw === 'admin123') {
            S.auth = true;
            S.user = { id: 'CDO-KTM-01', name: 'Dr. Govinda Prasad Sharma', role: 'super', title: 'Chief District Officer (CDO) / Super Admin', counter: 'Executive Secretariat' };
            S.login.err = '';
            S.route = 'dashboard';
            addAuditLog('Super Admin Login', 'Privileged CDO Session Authenticated');
            saveState();
            showToast('Welcome, Dr. Govinda Prasad Sharma (Super Admin)');
          } else {
            S.login.err = t('err.creds');
            render();
          }
          break;

        case 'logout':
          addAuditLog('User Logout', `${S.user ? S.user.name : 'Officer'} Signed Out`);
          S.auth = false;
          S.user = null;
          S.route = 'dashboard';
          S.login.captcha = generateCaptcha();
          S.login.captchaInput = '';
          saveState();
          render();
          break;

        /* Stock Verification Modals */
        case 'open-verify-modal':
          S.activeModal = 'verify';
          S.modalData = id;
          render();
          break;

        case 'simulate-scan':
          showToast('Barcode scanner reading: Matched DoP Batch Manifest!');
          break;

        case 'confirm-verification':
          const sToVerify = S.shipments.find(s => s.appNo === id);
          if (sToVerify) {
            sToVerify.stockVerified = true;
            if (sToVerify.status === 'created') sToVerify.status = 'ready_dispatch';
            addAuditLog('Stock Verification', `${sToVerify.bookletNo} for ${sToVerify.appNo}`);
            saveState();
            showToast(`Physical availability verified for ${sToVerify.appNo}`);
          }
          S.activeModal = null;
          render();
          break;

        case 'quick-verify':
          const sToQVer = S.shipments.find(s => s.appNo === id);
          if (sToQVer) {
            sToQVer.stockVerified = true;
            if (sToQVer.status === 'created') sToQVer.status = 'ready_dispatch';
            addAuditLog('Quick Stock Verification', `Booklet ${sToQVer.bookletNo} verified in vault`);
            saveState();
            showToast(`Physical availability verified for ${sToQVer.appNo}`);
            render();
          }
          break;

        /* Dispatch Modals */
        case 'open-dispatch-modal':
          S.activeModal = 'dispatch';
          S.modalData = id;
          render();
          break;

        case 'quick-dispatch':
          const sToQDisp = S.shipments.find(s => s.appNo === id);
          if (sToQDisp) {
            const trkQ = sToQDisp.trackingId || ('DLV-KTM-26-00' + Math.floor(1000 + Math.random() * 9000));
            sToQDisp.trackingId = trkQ;
            sToQDisp.status = 'dispatched';
            sToQDisp.dispatchedAt = new Date().toISOString().slice(0, 16);
            addAuditLog('Quick Tracking & Dispatch', `${trkQ} issued for ${sToQDisp.appNo}`);
            saveState();
            showToast(`Dispatched! Tracking ID: ${trkQ}`);
            render();
          }
          break;

        case 'confirm-dispatch':
          const sToDispatch = S.shipments.find(s => s.appNo === id);
          const trk = b.dataset.tracking || ('DLV-KTM-26-00' + Math.floor(1000 + Math.random() * 9000));
          if (sToDispatch) {
            sToDispatch.trackingId = trk;
            sToDispatch.status = 'dispatched';
            sToDispatch.dispatchedAt = new Date().toISOString().slice(0, 16);
            addAuditLog('Tracking & Dispatch', `${trk} issued for ${sToDispatch.appNo}`);
            saveState();
            showToast(`Passport dispatched! Tracking ID ${trk} generated.`);
          }
          S.activeModal = 'slip';
          S.modalData = id;
          render();
          break;

        case 'print-slip-modal':
          S.activeModal = 'slip';
          S.modalData = id;
          render();
          break;

        case 'scrim-close':
          if (e.target === b) {
            S.activeModal = null;
            render();
          }
          break;

        case 'close-modal':
          S.activeModal = null;
          render();
          break;

        /* Escalation Actions */
        case 'open-escalate-modal':
          S.activeModal = 'escalate';
          S.modalData = id;
          render();
          break;

        case 'confirm-escalation':
          const sToEscalate = S.shipments.find(s => s.appNo === id);
          const reason = $('#esc_reason') ? $('#esc_reason').value : 'Defect detected';
          if (sToEscalate) {
            sToEscalate.status = 'escalated';
            sToEscalate.escalationReason = reason;
            sToEscalate.escalatedBy = S.user ? S.user.name : 'Santosh Neupane';
            sToEscalate.escalatedAt = new Date().toISOString().slice(0, 16);
            addAuditLog('Escalation Filed', `${sToEscalate.appNo}: ${reason}`, 'FLAGGED');
            saveState();
            showToast(`Application ${sToEscalate.appNo} escalated to Super Admin`);
          }
          S.activeModal = null;
          render();
          break;

        case 'open-resolve-modal':
          S.activeModal = 'resolve';
          S.modalData = id;
          render();
          break;

        case 'confirm-resolution':
          const sToResolve = S.shipments.find(s => s.appNo === id);
          const resAction = $('#res_action') ? $('#res_action').value : 'reprint';
          if (sToResolve) {
            if (resAction === 'counter_pickup') {
              sToResolve.service = 'counter';
              sToResolve.status = 'counter_pickup';
              sToResolve.notes = 'Super Admin redirect: Citizen invited for Room 130 pickup';
            } else if (resAction === 'override_dispatch') {
              sToResolve.status = 'ready_dispatch';
              sToResolve.notes = 'Super Admin override: Cleared for regular courier dispatch';
            } else {
              sToResolve.status = 'created';
              sToResolve.notes = 'DoP reprint requested; awaiting central reprint shipment';
            }
            addAuditLog('Escalation Resolved', `CDO Resolution [${resAction}] for ${sToResolve.appNo}`);
            saveState();
            showToast(`Executive resolution applied for ${sToResolve.appNo}`);
          }
          S.activeModal = null;
          render();
          break;

        /* Super Admin Operations */
        case 'default-all-perms':
          S.perms = clone(DEFAULT_PERMISSIONS);
          addAuditLog('Permission Reset', 'CDO Reset All Permissions to Default Baseline');
          saveState();
          showToast('Administrative permissions restored to default baseline');
          render();
          break;

        case 'save-permissions':
          S.perms = {
            normal: {
              view: $('#p_norm_view') ? $('#p_norm_view').checked : true,
              verify: $('#p_norm_verify') ? $('#p_norm_verify').checked : true,
              dispatch: $('#p_norm_dispatch') ? $('#p_norm_dispatch').checked : true,
              escalate: $('#p_norm_escalate') ? $('#p_norm_escalate').checked : true,
              ledger: $('#p_norm_ledger') ? $('#p_norm_ledger').checked : false,
              admins: $('#p_norm_admins') ? $('#p_norm_admins').checked : false
            },
            verifyDesk: {
              view: $('#p_vdesk_view') ? $('#p_vdesk_view').checked : true,
              verify: $('#p_vdesk_verify') ? $('#p_vdesk_verify').checked : true,
              dispatch: $('#p_vdesk_dispatch') ? $('#p_vdesk_dispatch').checked : false,
              escalate: $('#p_vdesk_escalate') ? $('#p_vdesk_escalate').checked : true,
              ledger: $('#p_vdesk_ledger') ? $('#p_vdesk_ledger').checked : false,
              admins: $('#p_vdesk_admins') ? $('#p_vdesk_admins').checked : false
            }
          };
          addAuditLog('Permissions Saved', 'Updated Staff Privilege Matrix');
          saveState();
          showToast('Permission matrix updated successfully');
          break;

        case 'open-add-admin-modal':
          S.activeModal = 'add_admin';
          render();
          break;

        case 'confirm-add-admin':
          const nId = ($('#new_id') ? $('#new_id').value : '').trim() || 'DAO-KTM-5521';
          const nName = ($('#new_name') ? $('#new_name').value : '').trim();
          const nEmail = ($('#new_email') ? $('#new_email').value : '').trim();
          const nCounter = ($('#new_counter') ? $('#new_counter').value : '').trim() || 'Counter 3';

          if (!nName) {
            alert('Please enter officer name.');
            return;
          }

          S.admins.push({
            id: nId,
            name: nName,
            role: 'admin',
            title: 'Operations Officer',
            counter: nCounter,
            email: nEmail || `${nName.toLowerCase().replace(/\s+/g, '.')}@dao.gov.np`,
            status: 'active',
            lastLogin: new Date().toISOString().slice(0, 16)
          });
          addAuditLog('Admin User Created', `Created account ${nId} (${nName})`);
          saveState();
          showToast(`Account created for ${nName}`);
          S.activeModal = null;
          render();
          break;

        case 'toggle-admin-status':
          const adm = S.admins.find(a => a.id === id);
          if (adm) {
            adm.status = adm.status === 'active' ? 'inactive' : 'active';
            addAuditLog('Admin Status Changed', `${adm.id} marked ${adm.status}`);
            saveState();
            showToast(`${adm.name} account is now ${adm.status}`);
            render();
          }
          break;

        case 'remove-admin':
          if (confirm(`Are you sure you want to remove admin account ${id}?`)) {
            S.admins = S.admins.filter(a => a.id !== id);
            addAuditLog('Admin User Deleted', `Removed account ${id}`);
            saveState();
            showToast(`Admin account ${id} removed`);
            render();
          }
          break;

        case 'open-update-action-modal':
          S.activeModal = 'update_action';
          S.modalData = id;
          render();
          break;

        case 'confirm-update-action':
          const sToUpd = S.shipments.find(s => s.appNo === id);
          if (sToUpd) {
            const newStatus = ($('#upd_status') ? $('#upd_status').value : sToUpd.status);
            const newAgent = ($('#upd_agent') ? $('#upd_agent').value : sToUpd.agent);
            const newNotes = ($('#upd_notes') ? $('#upd_notes').value : sToUpd.notes);

            sToUpd.status = newStatus;
            if (newAgent) sToUpd.agent = newAgent;
            if (newNotes) sToUpd.notes = newNotes;

            if (newStatus === 'dispatched' && !sToUpd.trackingId) {
              sToUpd.trackingId = 'DLV-KTM-26-00' + Math.floor(1000 + Math.random() * 9000);
              sToUpd.dispatchedAt = new Date().toISOString().slice(0, 16);
            } else if (newStatus === 'delivered') {
              sToUpd.deliveredAt = new Date().toISOString().slice(0, 16);
              sToUpd.pod = 'POD-KTM-26-' + Math.floor(100000 + Math.random() * 900000);
            } else if (newStatus === 'failed') {
              sToUpd.attempt = (sToUpd.attempt || 1) + 1;
            }

            addAuditLog('Delivery Status Updated', `${sToUpd.appNo} updated to ${newStatus.toUpperCase()}`);
            saveState();
            showToast(`Delivery action updated to: ${newStatus.toUpperCase()}`);
          }
          S.activeModal = null;
          render();
          break;

        case 'view-shipment-detail':
          S.activeModal = 'detail';
          S.modalData = id;
          render();
          break;

        case 'open-bulk-verify':
          let verifiedCount = 0;
          S.shipments.forEach(s => {
            if (!s.stockVerified) {
              s.stockVerified = true;
              if (s.status === 'created') s.status = 'ready_dispatch';
              verifiedCount++;
            }
          });
          if (verifiedCount > 0) {
            addAuditLog('Bulk Stock Verification', `Verified ${verifiedCount} pending booklets in vault`);
            saveState();
            showToast(`Successfully verified physical availability for ${verifiedCount} passports!`);
          } else {
            showToast('All passports in vault are already verified.');
          }
          render();
          break;

        case 'reverify-modal':
          S.activeModal = 'audit_item';
          S.modalData = id;
          render();
          break;

        case 'confirm-audit-item':
          const sToAudit = S.shipments.find(s => s.appNo === id);
          if (sToAudit) {
            const newBin = ($('#audit_bin') ? $('#audit_bin').value : sToAudit.bin);
            sToAudit.bin = newBin;
            sToAudit.stockVerified = true;
            addAuditLog('Stock Audit Confirmed', `${sToAudit.bookletNo} verified in ${newBin}`);
            saveState();
            showToast(`Storage bin updated to ${newBin} for ${sToAudit.appNo}`);
          }
          S.activeModal = null;
          render();
          break;

        case 'select-all-dispatch':
          const chks = $$('.dispatch-chk');
          const allChecked = chks.every(c => c.checked);
          chks.forEach(c => c.checked = !allChecked);
          break;

        case 'generate-manifest-batch':
          const checkedAppNos = $$('.dispatch-chk:checked').map(c => c.dataset.id);
          let batchItems = S.shipments.filter(s => checkedAppNos.includes(s.appNo));
          if (batchItems.length === 0) {
            batchItems = S.shipments.filter(s => s.stockVerified && !s.dispatchedAt && s.service === 'home');
          }
          if (batchItems.length === 0) {
            batchItems = S.shipments.filter(s => s.service === 'home').slice(0, 5);
          }
          batchItems.forEach(s => {
            if (!s.trackingId) s.trackingId = 'DLV-KTM-26-00' + Math.floor(1000 + Math.random() * 9000);
            s.status = 'dispatched';
            s.dispatchedAt = new Date().toISOString().slice(0, 16);
            s.courier = 'Nepal Post Courier (Sundhara Hub)';
          });
          addAuditLog('Batch Manifest Generated', `Manifest MAN-KTM-2026-09-19-01 issued for ${batchItems.length} items`);
          saveState();
          showToast(`Batch manifest generated for ${batchItems.length} shipments!`);
          S.activeModal = 'batch_manifest';
          render();
          break;

        
        /* Scenario Switcher & Factory State Reset */
        

        case 'reset-factory-data':
          LS.remove('shipments');
          LS.remove('dao_disbursements');
          LS.remove('dao_cod_received');
          LS.remove('dao_admins');
          LS.remove('dao_audit');
          LS.remove('dao_perms');
          LS.remove('dao_scKey');

          S.shipments = JSON.parse(JSON.stringify(DEFAULT_SHIPMENTS));
          S.admins = JSON.parse(JSON.stringify(DEFAULT_ADMINS));
          S.perms = JSON.parse(JSON.stringify(DEFAULT_PERMISSIONS));
          S.auditLogs = JSON.parse(JSON.stringify(INITIAL_AUDIT_LOGS));
          S.disbursements = JSON.parse(JSON.stringify(DEFAULT_DISBURSEMENTS));
          S.codReceived = 0;
          S.scKey = 'default';
          S.searchQuery = '';
          S.statusFilter = 'all';
          S.shipmentFilter = 'all';
          S.activeModal = null;
          S.modalData = null;

          saveState();
          showToast('Reverted to original demo data (20 pristine records)!');
          render();
          break;

        case 'toggle-user-role':
          if (S.user && S.user.role === 'super') {
            S.auth = true;
            S.user = { id: 'DAO-KTM-8412', name: 'Santosh Neupane', role: 'admin', title: 'Dispatch & Operations Officer', counter: 'Counter 3 - Dispatch Desk' };
            S.route = 'dashboard';
            location.hash = '#/dashboard';
            showToast('Switched to Normal Admin (Santosh Neupane)');
          } else {
            S.auth = true;
            S.user = { id: 'CDO-KTM-01', name: 'Dr. Govinda Prasad Sharma', role: 'super', title: 'Chief District Officer (CDO) / Super Admin', counter: 'Executive Secretariat' };
            S.route = 'super_admin';
            location.hash = '#/super_admin';
            showToast('Switched to Super Admin (Dr. Govinda Prasad Sharma)');
          }
          saveState();
          render();
          break;

        case 'quick-switch-admin':
          S.auth = true;
          S.user = { id: 'DAO-KTM-8412', name: 'Santosh Neupane', role: 'admin', title: 'Dispatch & Operations Officer', counter: 'Counter 3 - Dispatch Desk' };
          S.route = 'dashboard';
          location.hash = '#/dashboard';
          saveState();
          showToast('Switched to Normal Admin (Santosh Neupane)');
          render();
          break;

        case 'quick-switch-super':
          S.auth = true;
          S.user = { id: 'CDO-KTM-01', name: 'Dr. Govinda Prasad Sharma', role: 'super', title: 'Chief District Officer (CDO) / Super Admin', counter: 'Executive Secretariat' };
          S.route = 'super_admin';
          location.hash = '#/super_admin';
          saveState();
          showToast('Switched to Super Admin (Dr. Govinda Prasad Sharma)');
          render();
          break;

        case 'open-voucher-modal':
          S.activeModal = 'voucher';
          addAuditLog('Settlement Voucher Generated', 'Inter-Agency Reconciliation Voucher VOUCH-DAO-2026-W37 Generated');
          render();
          break;

        case 'open-release-funds-modal':
          S.activeModal = 'release_funds';
          render();
          break;

        case 'confirm-release-funds':
          const relAmt = parseFloat($('#rel_amount') ? $('#rel_amount').value : 0) || 0;
          const relChan = ($('#rel_channel') ? $('#rel_channel').value : 'Single Treasury Account (TSA) Inter-Agency Transfer');
          const relRef = ($('#rel_ref') ? $('#rel_ref').value : '').trim() || ('TSA-KTM-2083-' + Math.floor(1000 + Math.random() * 9000));
          const relNotes = ($('#rel_notes') ? $('#rel_notes').value : '').trim() || 'Settlement of 80% delivery fee share for completed Kathmandu citizen deliveries';

          if (relAmt <= 0) {
            alert('Please specify a valid disbursement amount.');
            return;
          }

          const newDisb = {
            id: 'DISB-KTM-2083-0' + (S.disbursements.length + 1),
            date: new Date().toISOString().slice(0, 16),
            amount: relAmt,
            recipient: 'Nepal Post Directorate (Sundhara Central Hub)',
            method: relChan,
            refNo: relRef,
            approvedBy: S.user ? S.user.name : 'Dr. Govinda Prasad Sharma (CDO)',
            ordersCount: Math.max(1, Math.round(relAmt / 80)),
            notes: relNotes,
            status: 'SETTLED'
          };
          S.disbursements.unshift(newDisb);
          addAuditLog('Disbursement Released', `Released Rs ${relAmt} to Nepal Post (Ref: ${relRef})`);
          saveState();
          showToast(`Disbursed Rs ${relAmt} to Nepal Post Courier!`);
          S.activeModal = 'disb_voucher';
          S.modalData = relRef;
          render();
          break;

        case 'open-receive-cod-modal':
          S.activeModal = 'receive_cod';
          render();
          break;

        case 'confirm-receive-cod':
          const codAmt = parseFloat($('#cod_amount') ? $('#cod_amount').value : 0) || 0;
          const codRef = ($('#cod_ref') ? $('#cod_ref').value : '').trim() || ('DEP-RBB-KTM-' + Math.floor(1000 + Math.random() * 9000));

          if (codAmt <= 0) {
            alert('Please specify a valid remittance amount.');
            return;
          }

          S.codReceived = (S.codReceived || 0) + codAmt;
          addAuditLog('COD Remittance Received', `Received Rs ${codAmt} COD DAO share from Nepal Post (Ref: ${codRef})`);
          saveState();
          showToast(`Recorded Rs ${codAmt} COD remittance received into DAO Treasury!`);
          S.activeModal = null;
          render();
          break;

        case 'print-disbursement-voucher':
          S.activeModal = 'disb_voucher';
          S.modalData = id;
          render();
          break;


        case 'export-audit-csv':
          addAuditLog('Audit Export', 'Full Audit Log exported by ' + (S.user ? S.user.name : 'Officer'));
          showToast('Audit trail exported (CSV format downloaded)');
          break;
      }
    });

    /* Input Synchronization for Forms & Real-time Search */
    document.addEventListener('input', e => {
      const b = e.target.dataset.bind;
      if (b && S.login) {
        S.login[b] = e.target.value;
      }
      if (e.target.dataset.a === 'search-input' || e.target.dataset.a === 'search-shipments') {
        S.searchQuery = e.target.value;
        const targetA = e.target.dataset.a;
        render();
        const inp = $(`[data-a="${targetA}"]`);
        if (inp) {
          inp.focus();
          inp.selectionStart = inp.selectionEnd = inp.value.length;
        }
      }
    });

    /* Real-time Status Dropdown Filtering & Direct Inline Status Updates */
    document.addEventListener('change', e => {
      const el = e.target;
      if (el.matches && el.matches('[data-a-change="dao-scenario"]')) {
        const chosenScKey = el.value;
        const scMatch = DAO_SCENARIOS.find(s => s.key === chosenScKey) || DAO_SCENARIOS[0];
        S.scKey = scMatch.key;
        LS.set('dao_scKey', S.scKey);

        if (scMatch.route === 'super_admin' || scMatch.key === 'treasury_settlement') {
          S.auth = true;
          S.user = { id: 'CDO-KTM-01', name: 'Dr. Govinda Prasad Sharma', role: 'super', title: 'Chief District Officer (CDO) / Super Admin', counter: 'Executive Secretariat' };
          S.route = 'super_admin';
        } else {
          if (!S.auth) {
            S.auth = true;
            S.user = { id: 'DAO-KTM-8412', name: 'Santosh Neupane', role: 'admin', title: 'Dispatch & Operations Officer', counter: 'Counter 3 - Dispatch Desk' };
          }
          S.route = scMatch.route;
        }

        if (scMatch.filter === 'created') {
          S.statusFilter = 'all';
          S.shipmentFilter = 'created';
        } else if (scMatch.filter === 'ready_dispatch') {
          S.statusFilter = 'ready';
          S.shipmentFilter = 'ready_dispatch';
        } else if (scMatch.filter === 'transit') {
          S.statusFilter = 'transit';
          S.shipmentFilter = 'transit';
        } else if (scMatch.filter === 'failed') {
          S.statusFilter = 'failed';
          S.shipmentFilter = 'failed';
        } else if (scMatch.filter === 'escalated') {
          S.statusFilter = 'escalated';
          S.shipmentFilter = 'escalated';
        } else {
          S.statusFilter = 'all';
          S.shipmentFilter = 'all';
        }

        location.hash = '#/' + S.route;
        saveState();
        showToast(`Active Demo: ${scMatch.label.split('(')[0].trim()}`);
        render();
        return;
      }
      if (e.target.dataset.a === 'filter-status') {
        S.statusFilter = e.target.value;
        render();
      } else if (e.target.dataset.a === 'filter-shipment-status') {
        S.shipmentFilter = e.target.value;
        render();
      } else if (e.target.dataset.a === 'inline-status') {
        const id = e.target.dataset.id;
        const newStatus = e.target.value;
        const sToUpd = S.shipments.find(s => s.appNo === id);
        if (sToUpd && newStatus) {
          sToUpd.status = newStatus;
          if (newStatus === 'dispatched' && !sToUpd.trackingId) {
            sToUpd.trackingId = 'DLV-KTM-26-00' + Math.floor(1000 + Math.random() * 9000);
            sToUpd.dispatchedAt = new Date().toISOString().slice(0, 16);
          } else if (newStatus === 'delivered') {
            sToUpd.deliveredAt = new Date().toISOString().slice(0, 16);
            sToUpd.pod = 'POD-KTM-26-' + Math.floor(100000 + Math.random() * 900000);
          } else if (newStatus === 'failed') {
            sToUpd.attempt = (sToUpd.attempt || 1) + 1;
          }
          addAuditLog('Direct Status Change', `${sToUpd.appNo} updated to ${newStatus.toUpperCase()}`);
          saveState();
          showToast(`Status updated: ${newStatus.toUpperCase()}`);
          render();
        }
      }
    });

    /* Keyboard Shortcuts (Esc to close any modal) */
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && S.activeModal) {
        S.activeModal = null;
        render();
      }
    });

    /* Real-time Storage Listener for Cross-Portal Two-Way Sync */
    window.addEventListener('storage', e => {
      if (e.key === 'pds_shipments' || e.key === 'pds_scKey') {
        S.shipments = LS.get('shipments', S.shipments);
        render();
      }
    });

    
    /* Keep S.dockOpen in sync so re-renders do not collapse the controller dock */
    document.addEventListener('toggle', e => {
      if (e.target.classList && e.target.classList.contains('dock')) {
        S.dockOpen = e.target.open;
      }
    }, true);

    /* Initial Boot */
    window.addEventListener('DOMContentLoaded', () => {
      // Check if hash route was requested
      const hash = location.hash.replace('#/', '');
      if (['dashboard', 'verification', 'dispatch', 'shipments', 'escalations', 'audit', 'super_admin'].includes(hash)) {
        if (hash === 'super_admin' && (!S.user || S.user.role !== 'super')) {
          S.route = 'dashboard';
        } else {
          S.route = hash;
        }
      }
      render();
    });
  </script>
</body>

</html>
