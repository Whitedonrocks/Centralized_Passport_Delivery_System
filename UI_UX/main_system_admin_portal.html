                  <div class="hint">Use in <code>Authorization: Bearer &lt;key&gt;</code> header on all event ingest webhooks.</div>
                </div>
                <div class="field">
                  <label>Webhook URL (Outbound status synchronization)</label>
                  <input type="text" class="input" value="${courier.webhook}" readonly>
                </div>
              </div>
              <div class="modal-foot">
                <button class="btn danger" data-a="rotate-courier-key" data-id="${courier.id}">${ic('reset', 14)} Rotate Key Immediately</button>
                <button class="btn sec" data-a="close-modal">${t('btn.close')}</button>
              </div>
            </div>
          </div>
        `;
      }

      if (S.activeModal === 'audit_item') {
        const item = S.modalData || S.auditLogs[0];
        return `
          <div class="modal-backdrop" role="dialog" aria-modal="true">
            <div class="modal-card lg">
              <div class="modal-head">
                <h2>Audit Event Record: ${item.id}</h2>
                <button class="iconbtn sm" data-a="close-modal">${ic('x', 18)}</button>
              </div>
              <div class="modal-body">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px">
                  <div><b>Timestamp:</b> ${fmtD(item.timestamp).main}</div>
                  <div><b>Severity:</b> <span class="badge ${item.severity === 'SECURITY' ? 'purple' : 'ok'}">${item.severity}</span></div>
                  <div><b>Organization:</b> ${esc(item.org)}</div>
                  <div><b>Operator:</b> ${esc(item.operator)}</div>
                  <div><b>Action:</b> ${esc(item.action)}</div>
                  <div><b>Station IP:</b> <code>${item.station}</code></div>
                </div>
                <div class="field">
                  <label>Affected Record / Entity Payload</label>
                  <pre style="background:var(--surface-2);border:1px solid var(--line);padding:10px;border-radius:var(--radius);font-size:0.8125rem;overflow-x:auto">${esc(item.record)}</pre>
                </div>
                <div class="field">
                  <label>Cryptographic Block Hash (SHA-256)</label>
                  <div class="audit-hash" style="padding:8px">${item.hash}</div>
                </div>
              </div>
              <div class="modal-foot">
                <button class="btn sec" data-a="close-modal">${t('btn.close')}</button>
              </div>
            </div>
          </div>
        `;
      }

      if (S.activeModal === 'edit_perms') {
        const u = S.modalData || S.users[0];
        return `
          <div class="modal-backdrop" role="dialog" aria-modal="true">
            <div class="modal-card">
              <div class="modal-head">
                <h2>Permissions Matrix: ${esc(u.name)}</h2>
                <button class="iconbtn sm" data-a="close-modal">${ic('x', 18)}</button>
              </div>
              <div class="modal-body">
                <p><b>Role:</b> <span class="badge info">${u.role}</span> | <b>Staff ID:</b> ${u.staffId}</p>
                <div style="margin-top:16px;display:flex;flex-direction:column;gap:10px">
                  ${[
                    { k: 'stock_verify', l: 'Verify Physical Passport Vault Stock' },
                    { k: 'dispatch', l: 'Mark Passport For Logistics Dispatch' },
                    { k: 'generate_tracking', l: 'Generate Tracking Barcode & QR IDs' },
                    { k: 'escalate', l: 'Escalate Exceptions to Senior / CDO' },
                    { k: 'super_admin', l: 'Privileged Super Admin Features Access' },
                    { k: 'settle_treasury', l: 'Approve Single Treasury Account (TSA) Vouchers' },
                    { k: 'view_audit', l: 'Access Immutable Audit Ledger Stream' }
                  ].map(p => `
                    <label style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface-2);border-radius:var(--radius);cursor:pointer">
                      <input type="checkbox" checked>
                      <span style="font-size:0.875rem;font-weight:600">${p.l}</span>
                    </label>
                  `).join('')}
                </div>
              </div>
              <div class="modal-foot">
                <button class="btn sec" data-a="close-modal">${t('btn.cancel')}</button>
                <button class="btn primary" data-a="save-perms" data-id="${u.id}">${t('btn.save')}</button>
              </div>
            </div>
          </div>
        `;
      }

      if (S.activeModal === 'restore_backup') {
        return `
          <div class="modal-backdrop" role="dialog" aria-modal="true">
            <div class="modal-card">
              <div class="modal-head">
                <h2>Restore System State from JSON Snapshot</h2>
                <button class="iconbtn sm" data-a="close-modal">${ic('x', 18)}</button>
              </div>
              <div class="modal-body">
                <div class="field">
                  <label>Select JSON Snapshot File</label>
                  <input type="file" id="snapshot_file" accept=".json" class="input">
                </div>
                <div class="hint">Restores all District Offices, Couriers, User directory, and Audit ledgers to the captured snapshot state.</div>
              </div>
              <div class="modal-foot">
                <button class="btn sec" data-a="close-modal">${t('btn.cancel')}</button>
                <button class="btn primary" data-a="confirm-restore">Upload & Restore</button>
              </div>
            </div>
          </div>
        `;
      }

      return '';
    }

    /* ============ TOAST ============ */
    function renderToast() {
      if (!S.toast) return '';
      return `
        <div class="toast-banner" role="status" aria-live="polite">
          <span style="color:var(--ok)">${ic('check', 16)}</span>
          <span>${esc(S.toast)}</span>
        </div>
      `;
    }

    /* ============ ACCESSIBILITY PANEL ============ */
    function panelHTML() {
      const curLang = S.lang;
      const curTheme = S.theme;
      const curScale = S.scale;
      const curFilter = S.filter;

      return `
        <div class="scrim" data-a="a11y-close"></div>
        <div class="drawer" role="dialog" aria-modal="true" aria-label="${t('a11y.title')}">
          <div class="dh">
            <h2>${t('a11y.title')}</h2>
            <button class="iconbtn sm" data-a="a11y-close" aria-label="Close">${ic('x', 18)}</button>
          </div>

          <div class="dsec">
            <h3>${t('a11y.lang')}</h3>
            <div class="seg">
              <button type="button" data-a="p-lang" data-v="en" aria-pressed="${curLang === 'en'}">English</button>
              <button type="button" data-a="p-lang" data-v="ne" aria-pressed="${curLang === 'ne'}">नेपाली</button>
            </div>
          </div>

          <div class="dsec">
            <h3>${t('a11y.theme')}</h3>
            <div class="seg">
              <button type="button" data-a="p-theme" data-v="light" aria-pressed="${curTheme === 'light'}">${ic('sun', 16)} Light</button>
              <button type="button" data-a="p-theme" data-v="dark" aria-pressed="${curTheme === 'dark'}">${ic('moon', 16)} Dark</button>
            </div>
          </div>

          <div class="dsec">
            <h3>${t('a11y.scale')}</h3>
            <div class="sizer">
              <button type="button" class="btn sec sm" data-a="p-scale" data-v="-10">${ic('minus', 14)}</button>
              <output class="num">${curScale}%</output>
              <button type="button" class="btn sec sm" data-a="p-scale" data-v="10">${ic('plus', 14)}</button>
              <button type="button" class="btn sec sm" data-a="p-scale" data-v="0">100%</button>
            </div>
          </div>

          <div class="dsec">
            <h3>${t('a11y.filters')}</h3>
            <div class="opts">
              <button type="button" class="opt" data-a="p-filter" data-v="none" aria-checked="${curFilter === 'none'}">
                <b>Default (Normal Colors)</b>
                <small>Standard authoritative government palette</small>
              </button>
              <button type="button" class="opt" data-a="p-filter" data-v="hc" aria-checked="${curFilter === 'hc'}">
                <b>High Contrast (Yellow / Black)</b>
                <small>Maximum visual distinction for low vision</small>
              </button>
              <button type="button" class="opt" data-a="p-filter" data-v="mono" aria-checked="${curFilter === 'mono'}">
                <b>Monochrome (Grayscale)</b>
                <small>Pure black and white tones</small>
              </button>
              <button type="button" class="opt" data-a="p-filter" data-v="protan" aria-checked="${curFilter === 'protan'}">
                <b>Protanopia Filter</b>
                <small>Red-weak color blindness correction</small>
              </button>
              <button type="button" class="opt" data-a="p-filter" data-v="deuter" aria-checked="${curFilter === 'deuter'}">
                <b>Deuteranopia Filter</b>
                <small>Green-weak color blindness correction</small>
              </button>
              <button type="button" class="opt" data-a="p-filter" data-v="tritan" aria-checked="${curFilter === 'tritan'}">
                <b>Tritanopia Filter</b>
                <small>Blue-yellow color blindness correction</small>
              </button>
            </div>
          </div>

          <div class="dsec">
            <h3>${t('a11y.modes')}</h3>
            <div class="trow">
              <div>
                <b>Large System Cursor</b>
                <small>Enlarges mouse pointer for high visibility</small>
              </div>
              <button type="button" class="tgl" data-a="p-tgl" data-k="cursor" aria-checked="${!!S.cursor}">${S.cursor ? 'ON' : 'OFF'}</button>
            </div>
            <div class="trow">
              <div>
                <b>Pause Animations</b>
                <small>Stops motion, fades, and smooth transitions</small>
              </div>
              <button type="button" class="tgl" data-a="p-tgl" data-k="pause" aria-checked="${!!S.pause}">${S.pause ? 'ON' : 'OFF'}</button>
            </div>
            <div class="trow">
              <div>
                <b>Low Bandwidth Mode</b>
                <small>Hides non-critical graphics to save cellular data</small>
              </div>
              <button type="button" class="tgl" data-a="p-tgl" data-k="lowbw" aria-checked="${!!S.lowbw}">${S.lowbw ? 'ON' : 'OFF'}</button>
            </div>
          </div>

          <div class="dsec" style="text-align:center">
            <button type="button" class="btn sec block" data-a="p-reset">${ic('reset', 16)} <span>${t('a11y.reset')}</span></button>
          </div>
        </div>
      `;
    }

    /* ============ MAIN RENDER FUNCTION ============ */
    function render() {
      const app = document.getElementById('app');
      const modalRoot = document.getElementById('modal-root');
      const a11yRoot = document.getElementById('a11y-root');

      if (!S.auth) {
        app.innerHTML = loginPage();
      } else {
        let view = '';
        if (S.route === 'dashboard') view = dashboardView();
        else if (S.route === 'daos') view = daosView();
        else if (S.route === 'couriers') view = couriersView();
        else if (S.route === 'users') view = usersView();
        else if (S.route === 'finances') view = financesView();
        else if (S.route === 'infrastructure') view = infrastructureView();
        else if (S.route === 'audit') view = auditView();
        else view = dashboardView();

        app.innerHTML = chrome(view);
      }

      if (modalRoot) modalRoot.innerHTML = renderModals();
      if (a11yRoot) a11yRoot.innerHTML = S.panel ? panelHTML() : '';
    }

    /* ============ EVENT DELEGATION ============ */
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-a]');
      if (!b) return;

      const action = b.dataset.a;
      const v = b.dataset.v;
      const id = b.dataset.id;
      const tab = b.dataset.tab;
      const modal = b.dataset.modal;

      switch (action) {
        case 'nav':
          if (tab) {
            S.route = tab;
            location.hash = '#/' + tab;
            render();
            window.scrollTo(0, 0);
          }
          break;

        case 'lang-toggle':
          pref('lang', S.lang === 'en' ? 'ne' : 'en');
          break;

        case 'theme':
          pref('theme', S.theme === 'dark' ? 'light' : 'dark');
          break;

        case 'a11y-open':
          openPanel();
          break;

        case 'a11y-close':
          closePanel();
          break;

        case 'p-lang':
          pref('lang', v);
          break;

        case 'p-theme':
          pref('theme', v);
          break;

        case 'p-scale':
          if (v === '0') pref('scale', 100);
          else pref('scale', Math.max(90, Math.min(140, S.scale + Number(v))));
          break;

        case 'p-filter':
          pref('filter', v);
          break;

        case 'p-tgl':
          pref(b.dataset.k, !S[b.dataset.k]);
          break;

        case 'p-reset':
          S.scale = 100;
          S.filter = 'none';
          S.lowbw = false;
          S.cursor = false;
          S.pause = false;
          pref('theme', 'light');
          pref('lang', 'en');
          break;

        case 'toggle-pw':
          S.login.showPw = !S.login.showPw;
          render();
          break;

        case 'refresh-captcha':
          S.login.captcha = generateCaptcha();
          S.login.captchaInput = '';
          render();
          break;

        case 'submit-creds':
          if (!S.login.username || !S.login.password) {
            S.login.err = 'Please enter both administrative username and password.';
            render();
            return;
          }
          if (S.login.captchaInput.toUpperCase() !== S.login.captcha.toUpperCase()) {
            S.login.err = 'Invalid security captcha code. Please try again.';
            S.login.captcha = generateCaptcha();
            S.login.captchaInput = '';
            render();
            return;
          }
          S.login.err = '';
          S.login.mfaStep = true;
          render();
          break;

        case 'submit-mfa':
          if (S.login.mfaInput.trim() !== '842910' && S.login.mfaInput.trim().length !== 6) {
            S.login.err = 'Invalid two-factor authentication token. (Use demo token: 842910)';
            render();
            return;
          }
          S.auth = true;
          S.login.err = '';
          S.login.mfaStep = false;
          addAuditLog('System Admin Authenticated', 'MFA Verified Session Token Initialized', 'DoP Central System Admin', 'SECURITY');
          saveState();
          location.hash = '#/dashboard';
          render();
          break;

        case 'mfa-back':
          S.login.mfaStep = false;
          S.login.err = '';
          render();
          break;

        case 'fill-demo-sysadmin':
          S.login.username = 'sysadmin';
          S.login.password = 'admin123';
          S.login.captchaInput = S.login.captcha;
          render();
          break;

        case 'fill-demo-mfa':
          S.login.mfaInput = '842910';
          render();
          break;

        case 'reset-mock-data':
          localStorage.clear();
          location.reload();
          break;

        case 'logout':
          S.auth = false;
          saveState();
          location.hash = '#/login';
          render();
          break;

        case 'open-modal':
          S.activeModal = modal;
          if (id) {
            if (modal === 'edit_dao') S.modalData = S.daos.find(d => d.id === id);
            else if (modal === 'api_key') S.modalData = S.couriers.find(c => c.id === id);
            else if (modal === 'edit_perms') S.modalData = S.users.find(u => u.id === id);
            else if (modal === 'audit_item') S.modalData = S.auditLogs.find(l => l.id === id);
          }
          render();
          break;

        case 'close-modal':
          S.activeModal = null;
          S.modalData = null;
          render();
          break;

        case 'toggle-dao-maint':
          const d = S.daos.find(item => item.id === id);
          if (d) {
            d.status = d.status === 'active' ? 'maintenance' : 'active';
            addAuditLog('DAO Operational Status Modified', `${d.id} set to ${d.status}`);
            showToast(`${d.name} status updated to ${d.status}`);
          }
          break;

        case 'delete-dao':
          if (confirm('Are you sure you want to decommission and remove this District Administration Office?')) {
            const idx = S.daos.findIndex(item => item.id === id);
            if (idx >= 0) {
              const removed = S.daos.splice(idx, 1)[0];
              addAuditLog('DAO Removed', `${removed.id} (${removed.name}) archived from active national registry`, 'DoP Central System Admin', 'WARN');
              showToast(`${removed.name} removed from registry.`);
            }
          }
          break;

        case 'toggle-courier-status':
          const cr = S.couriers.find(item => item.id === id);
          if (cr) {
            cr.status = cr.status === 'active' ? 'suspended' : 'active';
            addAuditLog('Courier Status Toggled', `${cr.id} set to ${cr.status}`);
            showToast(`${cr.name} is now ${cr.status}.`);
          }
          break;

        case 'delete-courier':
          if (confirm('Are you sure you want to de-register this courier partner?')) {
            const idx = S.couriers.findIndex(item => item.id === id);
            if (idx >= 0) {
              const removed = S.couriers.splice(idx, 1)[0];
              addAuditLog('Courier De-registered', `${removed.id} (${removed.name}) revoked`, 'DoP Central System Admin', 'WARN');
              showToast(`${removed.name} de-registered.`);
            }
          }
          break;

        case 'rotate-courier-key':
          const crToRot = S.couriers.find(item => item.id === id);
          if (crToRot) {
            crToRot.apiKey = 'live_sec_' + Math.random().toString(36).substring(2, 14);
            addAuditLog('Courier API Secret Rotated', `${crToRot.id} new key generated`, 'DoP Central System Admin', 'SECURITY');
            showToast(`API Key for ${crToRot.name} rotated successfully!`);
            S.activeModal = null;
            render();
          }
          break;

        case 'toggle-user-lock':
          const u = S.users.find(item => item.id === id);
          if (u) {
            u.status = u.status === 'active' ? 'suspended' : 'active';
            addAuditLog('User Lock Toggled', `${u.id} (${u.name}) set to ${u.status}`, 'DoP Central System Admin', 'SECURITY');
            showToast(`${u.name} status updated.`);
          }
          break;

        case 'delete-user':
          if (confirm('Are you sure you want to delete this administrative user?')) {
            const idx = S.users.findIndex(item => item.id === id);
            if (idx >= 0) {
              const removed = S.users.splice(idx, 1)[0];
              addAuditLog('User Deleted', `${removed.id} (${removed.name}) removed`, 'DoP Central System Admin', 'SECURITY');
              showToast(`${removed.name} deleted.`);
            }
          }
          break;

        case 'toggle-maint-mode':
          S.infra.maintenanceMode = !S.infra.maintenanceMode;
          S.infra.maintenanceNotice = S.infra.maintenanceMode ?
            'MAINTENANCE ACTIVE: Citizen and regional desk access paused for database vacuuming.' :
            'System is operating in standard 24/7 high-availability government production mode.';
          addAuditLog('Maintenance Mode Modified', `System maintenance set to ${S.infra.maintenanceMode}`, 'DoP Central System Admin', 'WARN');
          showToast(`Maintenance mode: ${S.infra.maintenanceMode ? 'ENABLED' : 'DISABLED'}`);
          break;

        case 'test-ping':
          showToast('Ping test executed: All 5 government intranet clusters responded within 18ms.');
          break;

        case 'trigger-backup':
          const backupData = {
            exportDate: new Date().toISOString(),
            system: 'Centralized E-Passport Delivery System',
            version: '2.0-Production',
            daos: S.daos,
            couriers: S.couriers,
            users: S.users,
            finances: S.finances,
            vouchers: S.vouchers,
            auditLogs: S.auditLogs
          };
          const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `DoP_SystemAdmin_Backup_${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          addAuditLog('System Database Snapshot Exported', 'Full JSON database state downloaded', 'DoP Central System Admin');
          showToast('Database snapshot generated & downloaded!');
          break;

        case 'purge-cache':
          addAuditLog('Cache Purged', 'Redis cluster keys flushed', 'DoP Central System Admin');
          showToast('Task queue locks & Redis cache purged successfully!');
          break;

        case 'export-audit-csv':
          let csv = 'Log ID,Timestamp,Organization,Operator,Action,Record,Station,Severity,Hash\n';
          S.auditLogs.forEach(l => {
            csv += `"${l.id}","${l.timestamp}","${l.org}","${l.operator}","${l.action}","${l.record}","${l.station}","${l.severity}","${l.hash}"\n`;
          });
          const csvBlob = new Blob([csv], { type: 'text/csv' });
          const csvA = document.createElement('a');
          csvA.href = URL.createObjectURL(csvBlob);
          csvA.download = `DoP_Master_Audit_${new Date().toISOString().slice(0, 10)}.csv`;
          csvA.click();
          showToast('Master audit CSV downloaded!');
          break;

        case 'export-audit-json':
          const jsonBlob = new Blob([JSON.stringify(S.auditLogs, null, 2)], { type: 'application/json' });
          const jsonA = document.createElement('a');
          jsonA.href = URL.createObjectURL(jsonBlob);
          jsonA.download = `DoP_Master_Audit_${new Date().toISOString().slice(0, 10)}.json`;
          jsonA.click();
          showToast('Master audit JSON downloaded!');
          break;

        case 'print-audit':
        case 'export-health-report':
          window.print();
          break;

        case 'copy-api-key':
          const box = document.getElementById('k_box');
          if (box) {
            navigator.clipboard.writeText(box.value);
            showToast('API Key copied to clipboard!');
          }
          break;

        case 'confirm-restore':
          showToast('System snapshot verified and state restored.');
          S.activeModal = null;
          render();
          break;

        case 'refresh-data':
          showToast('Telemetry refreshed from GIDC cluster.');
          render();
          break;

        case 'save-perms':
          showToast('User permissions matrix updated.');
          S.activeModal = null;
          render();
          break;
      }
    });

    /* Form submissions */
    document.addEventListener('submit', e => {
      const form = e.target.closest('[data-a]');
      if (!form) return;
      e.preventDefault();

      const action = form.dataset.a;
      const fd = new FormData(form);

      if (action === 'submit-new-dao') {
        const newDao = {
          id: fd.get('id') || 'DAO-NEW-09',
          name: fd.get('name') || 'New DAO Office',
          nameNe: fd.get('nameNe') || 'नयाँ जि.प्र.का.',
          district: fd.get('district') || 'District',
          province: fd.get('province') || 'Bagmati Province',
          cdo: fd.get('cdo') || 'In-Charge CDO',
          cdoNe: fd.get('cdo') || 'प्रमुख जिल्ला अधिकारी',
          address: 'District Headquarters',
          counters: Number(fd.get('counters')) || 4,
          quota: Number(fd.get('quota')) || 100,
          activeShipments: 0,
          vaultStock: 50,
          status: 'active',
          phone: '01-4000000',
          email: 'dao.info@moha.gov.np'
        };
        S.daos.unshift(newDao);
        addAuditLog('New DAO Registered', `${newDao.id} (${newDao.name}) created in registry`);
        showToast(`Office ${newDao.name} registered successfully!`);
        S.activeModal = null;
        render();
      }

      if (action === 'submit-new-courier') {
        const newCr = {
          id: 'CR-' + Math.random().toString(36).substring(2, 6).toUpperCase(),
          name: fd.get('name') || 'Express Courier Partner',
          nameNe: fd.get('name') || 'कुरियर साझेदार',
          regNo: fd.get('regNo') || 'PVT-EXP-9900',
          type: fd.get('type') || 'Licensed Commercial Logistics',
          head: 'Operations Director',
          hub: fd.get('hub') || 'Central Dispatch Hub',
          coverage: fd.get('coverage') || 'Regional Corridor',
          fleet: Number(fd.get('fleet')) || 30,
          agents: Number(fd.get('agents')) || 50,
          apiStatus: 'connected',
          apiKey: 'cr_sec_' + Math.random().toString(36).substring(2, 14),
          webhook: fd.get('webhook') || 'https://api.partner.com.np',
          sla: 98.0,
          completedDeliveries: 0,
          status: 'active',
          phone: '01-4400000',
          email: 'support@logistics.com.np'
        };
        S.couriers.unshift(newCr);
        addAuditLog('Courier Partner Onboarded', `${newCr.id} (${newCr.name}) registered with live API credentials`);
        showToast(`Courier ${newCr.name} onboarded successfully!`);
        S.activeModal = null;
        render();
      }

      if (action === 'submit-new-user') {
        const newUser = {
          id: 'USR-' + Math.floor(100 + Math.random() * 900),
          name: fd.get('name') || 'New Staff Member',
          nameNe: fd.get('name') || 'नयाँ कर्मचारी',
          role: fd.get('role') || 'dao_admin',
          org: fd.get('org') || 'DAO Office',
          staffId: fd.get('staffId') || 'DOP-889',
          email: fd.get('email') || 'staff@dop.gov.np',
          phone: fd.get('phone') || '9851000000',
          status: 'active',
          lastLogin: new Date().toISOString().slice(0, 16),
          mfa: false,
          perms: ['stock_verify', 'dispatch']
        };
        S.users.unshift(newUser);
        addAuditLog('System User Provisioned', `${newUser.id} (${newUser.name}) assigned role ${newUser.role}`, 'DoP Central System Admin', 'SECURITY');
        showToast(`User ${newUser.name} provisioned!`);
        S.activeModal = null;
        render();
      }

      if (action === 'submit-voucher') {
        const amt = Number(fd.get('amount')) || 50000;
        const newVoucher = {
          id: 'VOUCH-2083-10-' + Math.floor(10 + Math.random() * 90),
          date: new Date().toISOString().slice(0, 16),
          source: fd.get('source') || 'DAO Central Treasury Escrow',
          dest: fd.get('dest') || 'Nepal Post Directorate',
          amount: amt,
          type: 'Online Settlement Disbursal (80% Courier Share)',
          refNo: fd.get('refNo') || 'TSA-DOP-KTM-2083-8841',
          approvedBy: 'Chief Financial Officer (DoP)',
          ordersCount: Math.round(amt / 80),
          status: 'SETTLED'
        };
        S.vouchers.unshift(newVoucher);
        S.finances.onlineDisbursedToCouriers += amt;
        S.finances.onlinePendingToCouriers = Math.max(0, S.finances.onlinePendingToCouriers - amt);
        addAuditLog('Treasury Voucher Issued', `${newVoucher.id} for Rs. ${amt} to ${newVoucher.dest}`);
        showToast(`Settlement voucher ${newVoucher.id} issued successfully!`);
        S.activeModal = null;
        render();
      }
    });

    /* Live Data Binding on inputs */
    document.addEventListener('input', e => {
      const b = e.target.dataset.bind;
      if (!b) return;

      if (b in S.login) {
        S.login[b] = e.target.value;
      } else if (b === 'searchQuery') {
        S.searchQuery = e.target.value;
        render();
      }
    });

    /* Change Event Handlers */
    document.addEventListener('change', e => {
      const action = e.target.dataset.aChange;
      if (!action) return;

      if (action === 'filter-role') {
        S.filterRole = e.target.value;
        render();
      } else if (action === 'filter-audit-org') {
        S.filterOrg = e.target.value;
        render();
      } else if (action === 'filter-audit-severity') {
        S.filterSeverity = e.target.value;
        render();
      } else if (action === 'switch-scenario') {
        const scKey = e.target.value;
        if (scKey === 'maintenance_sim') {
          S.infra.maintenanceMode = true;
          S.infra.maintenanceNotice = 'Emergency Infrastructure Upgrade in progress. All public intake queued.';
          showToast('Switched to Scenario 2: Emergency Maintenance');
        } else if (scKey === 'courier_api_failover') {
          const kvd = S.couriers.find(c => c.id === 'CR-KD-04');
          if (kvd) kvd.apiStatus = 'degraded';
          showToast('Switched to Scenario 3: Courier Gateway Failover');
        } else if (scKey === 'treasury_reconciliation') {
          S.route = 'finances';
          showToast('Switched to Scenario 4: National Treasury Reconciliation');
        } else if (scKey === 'security_audit') {
          S.route = 'audit';
          showToast('Switched to Scenario 5: Master Security Audit');
        } else {
          S.infra.maintenanceMode = false;
          S.infra.maintenanceNotice = 'System is operating in standard 24/7 high-availability government production mode.';
          showToast('Switched to Scenario 1: Standard Multi-DAO Operations');
        }
        render();
      }
    });

    /* Keyboard navigation */
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (S.activeModal) {
          S.activeModal = null;
          S.modalData = null;
          render();
        } else if (S.panel) {
          closePanel();
        }
      }
    });

    /* Routing logic */
    function route() {
      const hash = location.hash.replace(/^#\/?/, '');
      if (!S.auth) {
        S.route = 'login';
      } else {
        if (!hash || hash === 'login') S.route = 'dashboard';
        else S.route = hash;
      }
      render();
    }

    window.addEventListener('hashchange', route);

    /* Initialization */
    applyPrefs();
    route();

  </script>
</body>

</html>
